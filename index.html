<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swap in Seconds | Brandon Walker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
  <div class="spotlight" aria-hidden="true"></div>
    <main class="deck" aria-roledescription="presentation">
      <section class="slide" id="title" data-gel="house" aria-roledescription="slide" aria-label="Swap in Seconds">
        <h1>Swap in Seconds</h1>
      </section>

      <section class="slide" id="about" data-gel="house" aria-roledescription="slide" aria-label="About me">
        <h2>About me</h2>
      </section>

      <section class="slide" id="frames" data-gel="house" aria-roledescription="slide" aria-label="One base, different frames">
        <h2>One base, different frames</h2>
      </section>

      <section class="slide" id="solo" data-gel="magenta" aria-roledescription="slide" aria-label="Solo: motion">
        <h2>Solo: motion</h2>
      </section>

      <section class="slide" id="dreamride" data-gel="amber" aria-roledescription="slide" aria-label="DreamRide: Sugoi Flower Farm">
        <h2>DreamRide: Sugoi Flower Farm</h2>
      </section>

      <section class="slide" id="bench" data-gel="teal" aria-roledescription="slide" aria-label="Bench: pricing">
        <h2>Bench: pricing</h2>
      </section>

      <section class="slide" id="utility" data-gel="violet" aria-roledescription="slide" aria-label="Utility: David's Bridal">
        <h2>Utility: David's Bridal</h2>
      </section>

      <section class="slide" id="test-spin" data-gel="lime" aria-roledescription="slide" aria-label="Test Spin: the brief">
        <h2>Test Spin: the brief</h2>
      </section>

      <section class="slide" id="architecture" data-gel="lime" aria-roledescription="slide" aria-label="Test Spin: architecture">
        <h2>Test Spin: architecture</h2>
      </section>

      <section class="slide" id="decisions" data-gel="lime" aria-roledescription="slide" aria-label="Test Spin: three decisions">
        <h2>Test Spin: three decisions</h2>
      </section>

      <section class="slide" id="next" data-gel="lime" aria-roledescription="slide" aria-label="Test Spin: with more time">
        <h2>Test Spin: with more time</h2>
      </section>

      <section class="slide" id="close" data-gel="house" aria-roledescription="slide" aria-label="Same base, different frames">
        <h2>Same base, different frames</h2>
      </section>

      <section class="slide" id="thanks" data-gel="house" aria-roledescription="slide" aria-label="Thank you">
        <h2>Thank you</h2>
      </section>
    </main>

    <p class="deck-status" aria-hidden="true">
      <span data-deck-current>1</span> / <span data-deck-total>13</span>
    </p>
    <p class="visually-hidden" aria-live="polite" data-deck-announcer></p>

    <script src="js/deck.js" defer></script>
  </body>
</html>
