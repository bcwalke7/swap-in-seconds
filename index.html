<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swap in Seconds | Brandon Walker</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <main class="deck" aria-roledescription="presentation">
      <section class="slide" id="title" aria-roledescription="slide" aria-label="Swap in Seconds">
        <h1>Swap in Seconds</h1>
      </section>

      <section class="slide" id="about" aria-roledescription="slide" aria-label="About me">
        <h2>About me</h2>
      </section>

      <section class="slide" id="frames" aria-roledescription="slide" aria-label="One base, different frames">
        <h2>One base, different frames</h2>
      </section>

      <section class="slide" id="solo" aria-roledescription="slide" aria-label="Solo: motion">
        <h2>Solo: motion</h2>
      </section>

      <section class="slide" id="dreamride" aria-roledescription="slide" aria-label="DreamRide: Sugoi Flower Farm">
        <h2>DreamRide: Sugoi Flower Farm</h2>
      </section>

      <section class="slide" id="bench" aria-roledescription="slide" aria-label="Bench: pricing">
        <h2>Bench: pricing</h2>
      </section>

      <section class="slide" id="utility" aria-roledescription="slide" aria-label="Utility: David's Bridal">
        <h2>Utility: David's Bridal</h2>
      </section>

      <section class="slide" id="test-spin" aria-roledescription="slide" aria-label="Test Spin: the brief">
        <h2>Test Spin: the brief</h2>
      </section>

      <section class="slide" id="architecture" aria-roledescription="slide" aria-label="Test Spin: architecture">
        <h2>Test Spin: architecture</h2>
      </section>

      <section class="slide" id="decisions" aria-roledescription="slide" aria-label="Test Spin: three decisions">
        <h2>Test Spin: three decisions</h2>
      </section>

      <section class="slide" id="next" aria-roledescription="slide" aria-label="Test Spin: with more time">
        <h2>Test Spin: with more time</h2>
      </section>

      <section class="slide" id="close" aria-roledescription="slide" aria-label="Same base, different frames">
        <h2>Same base, different frames</h2>
      </section>

      <section class="slide" id="thanks" aria-roledescription="slide" aria-label="Thank you">
        <h2>Thank you</h2>
      </section>
    </main>

    <p class="deck-status" aria-hidden="true">
      <span data-deck-current>1</span> / <span data-deck-total>13</span>
    </p>
    <p class="visually-hidden" aria-live="polite" data-deck-announcer></p>

    <script src="js/deck.js" defer></script>
  </body>
</html>
